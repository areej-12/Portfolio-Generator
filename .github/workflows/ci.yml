name: CI

on:
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest test_app.py -v

  build-docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t se202l-app:ci .

      - name: Run container
        run: docker run -d --name se202l-container -p 5000:5000 se202l-app:ci

      - name: Health check
        run: |
          sleep 5
          curl --fail http://localhost:5000/health

      - name: Cleanup
        if: always()
        run: docker rm -f se202l-container || true
